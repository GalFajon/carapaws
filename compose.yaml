services:
  web:
    build:
      context: ./ui/carapaws
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./ui/carapaws:/app
      - web_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: http://api:3000
    depends_on:
      - api

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://carapaws:carapaws_dev@db:5432/carapaws
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: carapaws
      POSTGRES_USER: carapaws
      POSTGRES_PASSWORD: carapaws_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carapaws -d carapaws"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  web_node_modules:
  api_node_modules:
  postgres_data:
